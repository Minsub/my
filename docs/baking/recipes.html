<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>베이킹 레시피</title>
<style>
  :root {
    --bg: #faf6ef;
    --surface: #ffffff;
    --surface-2: #f4ede1;
    --ink: #2b2118;
    --ink-2: #6b5d4f;
    --ink-3: #9a8b7a;
    --line: #e8dfd0;
    --accent: #b8742a;
    --accent-soft: #f6e6cf;
    --bar: #e2b77a;
    --bar-strong: #c88a3c;
    --memo-bg: #fff6c9;
    --memo-ink: #6a4f00;
    --memo-line: #ecd27a;
    --heat: #d9572b;
    --heat-soft: #fbe2d6;
    --ok: #3f7d4e;
    --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 16px rgba(60, 40, 20, .06);
    --p1: #c88a3c;
    --p2: #d0675a;
    --p3: #6f9a5b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130f;
      --surface: #211b16;
      --surface-2: #2a231c;
      --ink: #f2e9dc;
      --ink-2: #c4b6a4;
      --ink-3: #8d7f6e;
      --line: #3a3027;
      --accent: #e0a25a;
      --accent-soft: #3b2c1b;
      --bar: #8c6435;
      --bar-strong: #d39a52;
      --memo-bg: #3a3218;
      --memo-ink: #f1dc8f;
      --memo-line: #6b5a22;
      --heat: #f07a4d;
      --heat-soft: #3d2219;
      --ok: #79c08a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      --p1: #d9a05a;
      --p2: #e5867a;
      --p3: #8fbd7a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    word-break: keep-all;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 64px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  header.top .sub { color: var(--ink-3); font-size: 13px; }

  /* 레시피 선택 카드 */
  .picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
  .pick {
    text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
    padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .pick:hover { transform: translateY(-1px); }
  .pick[aria-selected="true"] { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
  .pick .emoji { font-size: 26px; line-height: 1; }
  .pick .name { font-weight: 700; font-size: 15px; }
  .pick .meta { color: var(--ink-3); font-size: 12px; }
  .pick .mini { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
  .pick .mini span { display: block; height: 100%; }

  /* 히어로 */
  .hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .hero h2 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
  .hero .source { color: var(--ink-3); font-size: 13px; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
  .chip.heat { background: var(--heat-soft); color: var(--heat); font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .toolbar .label { font-size: 13px; color: var(--ink-2); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
  .toolbar .spacer { flex: 1; }
  .link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 0; }

  /* 오븐 타임라인 */
  .oven { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .sec-title { font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .oven-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin: 8px 0; }
  .oven-row .what { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oven-track { position: relative; height: 26px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
  .oven-fill { position: absolute; inset: 0 auto 0 0; display: flex; align-items: center; padding: 0 9px; border-radius: 7px;
    background: linear-gradient(90deg, var(--heat-soft), color-mix(in srgb, var(--heat) 45%, var(--heat-soft))); color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .oven-fill .range { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.35) 4px 8px); }
  .oven-scale { display: grid; grid-template-columns: 110px 1fr; gap: 10px; font-size: 11px; color: var(--ink-3); }
  .oven-scale .ticks { display: flex; justify-content: space-between; }

  /* 구성 블록 */
  .part { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .part-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .part-head .ttl { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .part-head .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--pc, var(--accent)); color: #fff; font-size: 12px; }
  .part-head .total { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .part-head .total b { color: var(--ink); }
  .part-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
  .col { padding: 14px 18px 18px; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); }

  /* 재료 */
  .ing { list-style: none; margin: 0; padding: 0; }
  .ing li { padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .ing li:last-child { border-bottom: 0; }
  .ing-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; cursor: pointer; }
  .ing-row input { width: 18px; height: 18px; margin: 0; accent-color: var(--ok); cursor: pointer; }
  .ing-name { font-weight: 600; overflow-wrap: anywhere; }
  .ing-qty { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; white-space: nowrap; }
  .ing-qty .u { font-weight: 500; color: var(--ink-3); margin-left: 1px; }
  .ing-qty .orig { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); }
  .ing-bar { margin: 5px 0 0 30px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .ing-bar span { display: block; height: 100%; background: var(--bar); border-radius: 3px; }
  .ing-note { margin: 4px 0 0 30px; font-size: 12.5px; color: var(--ink-2); }
  .ing li.done .ing-name, .ing li.done .ing-qty { color: var(--ink-3); text-decoration: line-through; }
  .ing li.done .ing-bar span { background: var(--ok); opacity: .5; }

  /* 손글씨 메모 */
  .hand { display: inline; background: var(--memo-bg); color: var(--memo-ink); border-bottom: 1.5px solid var(--memo-line); padding: 0 3px; border-radius: 3px; font-style: italic; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hand::before { content: "✍ "; font-style: normal; }
  .unsure { color: var(--ink-3); font-style: normal; font-size: .9em; }
  .strike { text-decoration: line-through; color: var(--ink-3); }

  /* 공정 */
  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .steps li { position: relative; padding: 0 0 14px 34px; }
  .steps li::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child { padding-bottom: 0; }
  .steps li:last-child::before { display: none; }
  .steps .dot { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .steps .st-title { font-weight: 700; margin-right: 4px; }
  .steps .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .steps .sub { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }

  .notes { list-style: none; margin: 14px 0 0; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; display: grid; gap: 6px; font-size: 13.5px; }
  .notes li::before { content: "• "; color: var(--accent); }

  /* 전체 재료 */
  .all { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .all-head { flex-wrap: wrap; gap: 6px 12px; }
  .all-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2); }
  .all-legend i, .all-split i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
  .all-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
  .all-list li { padding: 8px 0; border-bottom: 1px dashed var(--line); min-width: 0; }
  .all-row { display: flex; justify-content: space-between; gap: 8px; }
  .all-row .ing-name { font-weight: 600; }
  .all-bar { display: flex; gap: 2px; height: 6px; margin-top: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .all-bar span { display: block; height: 100%; }
  .all-split { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .all-foot { margin-top: 10px; font-size: 13px; color: var(--ink-2); text-align: right; }
  .all-foot b { color: var(--ink); }
  /* 접기 */
  .fold-head { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 0; }
  .fold-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .part-head.fold-head { background: var(--surface-2); padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .box-head .sec-title { margin: 0; }
  .fold-head > :first-child { flex: 1; min-width: 0; }
  .box-head + .fold-body { margin-top: 10px; }
  .fold-summary { display: none; font-size: 12px; color: var(--ink-3); }
  .folded .fold-summary { display: inline; }
  .folded > .fold-body { display: none; }
  .folded > .part-head { border-bottom-color: transparent; }
  .chev { flex: none; width: 20px; height: 20px; display: grid; place-items: center; }
  .chev::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
  .folded .chev::before { transform: translateX(-2px) rotate(-45deg); }
  .tip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .tip .notes { margin: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-3); margin: 22px 0 0; }

  @media (max-width: 720px) {
    .part-body { grid-template-columns: 1fr; }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
    .oven-row, .oven-scale { grid-template-columns: 84px 1fr; }
  }
  @media (max-width: 520px) {
    .wrap { padding-top: 14px; }
    .picker { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 62%; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin-right: -16px; padding-right: 16px; }
    .pick { scroll-snap-align: start; }
    .hero h2 { font-size: 21px; }
    .all-list { grid-template-columns: 1fr; }
    .part-head.fold-head, .col, .hero, .oven, .tip, .all { padding-left: 14px; padding-right: 14px; }
  }
  @media print {
    body { background: #fff; }
    .picker, .toolbar, .legend, .chev { display: none; }
    .folded > .fold-body { display: block; }
    .part, .hero, .oven, .tip, .all { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>베이킹 레시피</h1>
    <span class="sub" id="count"></span>
  </header>
  <nav class="picker" id="picker" role="tablist" aria-label="레시피"></nav>
  <main id="view"></main>
  <div class="legend">
    <span><span class="hand">손글씨</span> 수업 자료 위 메모</span>
    <span><span class="unsure">(?)</span> 사진으로 읽기 어려운 글자</span>
    <span>막대 = 구성 안에서 재료 무게 비중</span>
  </div>
</div>

<script>
// 원본: docs/baking/recipes/*.md. 레시피를 고치면 Markdown과 함께 고친다.

const recipes = [

          { title: "헤이즐넛 버터", text: "냄비에 실온 버터를 넣고 가열해 갈색 버터를 만든다. 쓰기 전까지 잠시 둔다." },
          { title: "흰자 섞기", text: "흰자에 설탕·꿀·소금을 넣고 잔거품이 일 때까지 거품기로 가볍게 섞는다." },
          { title: "가루 넣기", text: "아몬드가루·강력분·박력분을 체 쳐 넣고 가루가 안 보일 때까지 섞는다." },

      {

      },
      {
        name: "우유크림",
        items: [
          { name: "마스카포네", qty: 91, unit: "g", note: "{{알라(Arla)(?)}}" },

          { name: "설탕", qty: 20, unit: "g" },
        ],
        steps: [
          { text: "모든 재료를 함께 휘핑해 쓴다.", sub: ["{{세 재료를 같이 계량해 냉장고에 둔다}}"] },
        ],
      },
    ],
    notes: [],
  },
  {
    id: "walnut-carrot-cake",
    emoji: "🥕",
    name: "호두당근케이크",
    source: "Merrybonbon Baking Class · 손글씨 메모 포함",
    chips: ["원형팬 2개 (1/3 · 2/3)", "시트 + 크림치즈크림 + 크럼블", "시트 냉동 1달 · 실온 2일"],
    ovens: [
      { what: "호두 전처리", temp: 170, min: 7, max: 8 },
      { what: "시트 (1/3 반죽)", temp: 170, min: 40 },
      { what: "시트 (2/3 반죽)", temp: 170, min: 50 },
      { what: "크럼블", temp: 170, min: 20 },
    ],
    parts: [
      {
        name: "당근시트",
        items: [
          { name: "계란", qty: 3, unit: "개", grams: 180, note: "{{특란, 개당 60g~}}" },
          { name: "흑설탕", qty: 210, unit: "g", note: "{{180g까지 줄여도 됨}}" },
          { name: "카놀라유", qty: 220, unit: "g", note: "{{포도씨유 가능 / 올리브유 ✕}}" },
          { name: "중력분", qty: 255, unit: "g", note: "체 침" },
          { name: "베이킹파우더", qty: 3, unit: "g", note: "{{↑ 위로 부풂}}" },
          { name: "베이킹소다", qty: 3, unit: "g", note: "{{← → 옆으로 퍼짐}}" },
          { name: "시나몬파우더", qty: 4, unit: "g", note: "{{기호에 따라 넣거나 빼도 됨(?)}}" },
          { name: "채썬 당근", qty: 180, unit: "g", note: "{{채칼}}" },
          { name: "구운 호두", qty: 40, unit: "g", note: "{{끓는 물 1분 데쳐 불순물 제거 → 170℃ 7~8분 굽기}}" },
        ],
        steps: [
          { title: "호두 준비", text: "{{끓는 물에 1분 데쳐 불순물 제거 후 오븐에 굽는다.}}", heat: "170℃ · 7~8분" },
          { text: "계란·흑설탕을 넣고 풀어준다." },
          { text: "카놀라유를 넣고 섞는다." },
          { text: "체 친 중력분·베이킹파우더·베이킹소다·시나몬파우더(가루류 모두)를 넣고 섞는다." },
          { text: "토핑(당근·호두)을 넣고 날가루가 없어질 때까지만 섞는다." },
          { text: "유산지를 깐 원형팬에 반죽을 1/3, 2/3씩 나눠 담는다." },
          { title: "굽기", text: "170℃로 예열한 오븐에서 굽는다.", heat: "170℃ · 40분 / 50분", sub: ["{{1/3 반죽 팬 → 40분, 2/3 반죽 팬 → 50분}}", "{{오븐에서 바로 꺼내기}}"] },
        ],
      },
      {
        name: "크림치즈크림",
        items: [
          { name: "크림치즈", qty: 200, unit: "g", note: "{{필라델피아, 차갑게}}" },
          { name: "슈가파우더", qty: 80, unit: "g" },
          { name: "생크림", qty: 170, unit: "g", note: "{{동물성, 차갑게}}" },
        ],
        steps: [
          { text: "크림치즈와 슈가파우더를 먼저 부드럽게 휘핑한다.", badges: ["{{고속}}"] },
          { text: "생크림을 여러 번에 나누어 넣으며 휘핑한다.", badges: ["{{깍지 804}}"] },
        ],
        notes: ["{{냉동 가능. 해동은 실온에서 키친타월 위에 올려두기}}"],
      },
      {
        name: "크럼블",
        items: [
          { name: "아몬드가루", qty: 30, unit: "g" },
          { name: "박력분", qty: 30, unit: "g" },
          { name: "버터", qty: 30, unit: "g", note: "{{앵커, 실온(?)}}" },
          { name: "설탕", qty: 20, unit: "g", note: "{{백설탕·갈색설탕}}" },
        ],
        steps: [
          { text: "모든 재료를 볼에 넣고 가루를 소보로 형태로 뭉친다." },
          { title: "굽기", text: "오븐에 굽는다.", heat: "170℃ · 20분" },
        ],
      },
    ],
    notes: ["{{시트는 냉동 1달 / 실온 2일 보관 가능}}"],
  },
];

const scales = [0.5, 1, 1.5, 2];
const FOLD_KEY = "baking_folds_v1";
const state = { id: recipes[0].id, scale: 1, checked: new Set(), folded: new Set(loadFolds()) };

// 접은 상자 기억. 앱 iframe(sandbox)에서는 저장소 접근이 막히므로 실패하면 메모리에만 둔다.
function loadFolds() {
  try { return JSON.parse(localStorage.getItem(FOLD_KEY) || "[]"); } catch (_) { return []; }
}
function saveFolds() {
  try { localStorage.setItem(FOLD_KEY, JSON.stringify([...state.folded])); } catch (_) {}
}

const isFolded = (key) => state.folded.has(`${state.id}:${key}`);
const foldClass = (key) => (isFolded(key) ? " folded" : "");

function foldHead(key, cls, inner) {
  return `<button type="button" class="${cls} fold-head" data-fold="${key}" aria-expanded="${!isFolded(key)}">${inner}<span class="chev" aria-hidden="true"></span></button>`;
}

function foldKeys(r) {
  return [
    ...(r.parts.length > 1 ? ["all"] : []),
    "oven",
    ...r.parts.map((_, i) => `part-${i}`),
    ...(r.notes.length ? ["notes"] : []),
  ];
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// {{메모}} → 손글씨, ~~값~~ → 지운 값, (?) → 불확실 표시
function rich(text) {
  return esc(text)
    .replace(/\{\{(.+?)\}\}/g, '<span class="hand">$1</span>')
    .replace(/~~(.+?)~~/g, '<span class="strike">$1</span>')
    .replace(/\(\?\)/g, '<span class="unsure">(?)</span>');
}

function fmt(n) {
  if (Number.isInteger(n)) return String(n);
  return n < 10 ? String(Math.round(n * 10) / 10) : String(Math.round(n));
}

function gramsOf(item) {
  if (item.unit === "g") return item.qty;
  return item.grams || 0;
}

function partTotal(part) {
  return part.items.reduce((sum, item) => sum + gramsOf(item), 0);
}

const partColors = ["var(--p1)", "var(--p2)", "var(--p3)"];
const partColor = (i) => partColors[i % partColors.length];

// 구성(반죽·커드·크림)에 흩어진 같은 재료를 이름·단위로 묶는다. 무게가 없는 양은 구성별로 따로 적는다.
function combinedItems(r) {
  const map = new Map();
  r.parts.forEach((part, pi) => {
    part.items.forEach((item) => {
      const key = item.qty == null ? `${item.name}|text|${pi}` : `${item.name}|${item.unit}`;
      if (!map.has(key)) map.set(key, { name: item.name, unit: item.unit, text: item.text, grams: 0, qty: 0, from: [] });
      const row = map.get(key);
      if (item.qty != null) {
        row.qty += item.qty;
        row.grams += gramsOf(item);
      }
      row.from.push({ pi, part: part.name, qty: item.qty, grams: gramsOf(item), text: item.text });
    });
  });
  return [...map.values()];
}

function renderCombined(r) {
  if (r.parts.length < 2) return "";
  const rows = combinedItems(r);
  const maxG = Math.max(...rows.map((x) => x.grams), 1);
  const legend = r.parts.map((p, i) => `<span><i style="background:${partColor(i)}"></i>${esc(p.name)}</span>`).join("");
  const items = rows.map((row) => {
    const qty = row.qty
      ? `<span class="ing-qty">${fmt(row.qty * state.scale)}<span class="u">${esc(row.unit)}</span></span>`
      : `<span class="ing-qty">${rich(row.text)}</span>`;
    const bar = row.grams
      ? `<div class="all-bar" aria-hidden="true" style="width:${Math.max((row.grams / maxG) * 100, 2)}%">${row.from.map((f) => `<span style="flex:${f.grams};background:${partColor(f.pi)}"></span>`).join("")}</div>`
      : "";
    const split = row.from.length > 1 || !row.qty
      ? `<div class="all-split">${row.from.map((f) => `<span><i style="background:${partColor(f.pi)}"></i>${esc(f.part)} ${f.qty != null ? fmt(f.qty * state.scale) + esc(row.unit) : rich(f.text)}</span>`).join("")}</div>`
      : `<div class="all-split"><span><i style="background:${partColor(row.from[0].pi)}"></i>${esc(row.from[0].part)}</span></div>`;
    return `<li><div class="all-row"><span class="ing-name">${esc(row.name)}</span>${qty}</div>${bar}${split}</li>`;
  }).join("");
  const total = rows.reduce((sum, x) => sum + x.grams, 0);
  return `<section class="all${foldClass("all")}">
    ${foldHead("all", "all-head box-head", `<span class="sec-title">🧺 전체 재료 · ${rows.length}가지</span><span class="all-legend box-extra">${legend}</span>`)}
    <div class="fold-body">
    <ul class="all-list">${items}</ul>
    <div class="all-foot">전체 무게 <b>${fmt(total * state.scale)}g</b>${r.parts.some((p) => p.items.some((it) => it.unit === "개")) ? " (계란은 개당 60g으로 셈)" : ""}</div>
    </div>
  </section>`;
}

function renderPicker() {
  const picker = document.getElementById("picker");
  picker.innerHTML = recipes.map((r) => {
    const totals = r.parts.map(partTotal);
    const sum = totals.reduce((a, b) => a + b, 0) || 1;
    const mini = totals.map((t, i) => `<span style="width:${(t / sum) * 100}%;background:${partColor(i)}"></span>`).join("");
    const heat = [...new Set(r.ovens.map((o) => o.temp + "℃"))].join(" · ");
    return `<button class="pick" role="tab" aria-selected="${r.id === state.id}" data-id="${r.id}">
      <span class="emoji">${r.emoji}</span>
      <span class="name">${esc(r.name)}</span>
      <span class="meta">${r.parts.length}개 구성 · ${heat} · ${fmt(sum)}g</span>
      <span class="mini" aria-hidden="true">${mini}</span>
    </button>`;
  }).join("");
  document.getElementById("count").textContent = `${recipes.length}개`;
}

function renderOven(r) {
  const maxMin = Math.max(...r.ovens.map((o) => o.max || o.min));
  const scaleMax = Math.ceil(maxMin / 10) * 10 || 10;
  const rows = r.ovens.map((o) => {
    const end = o.max || o.min;
    const w = (end / scaleMax) * 100;
    const range = o.max ? `<span class="range" style="width:${((o.max - o.min) / end) * 100}%"></span>` : "";
    const time = o.max ? `${o.min}~${o.max}분` : `${o.min}분`;
    return `<div class="oven-row" title="${esc(o.note || "")}">
      <span class="what">${esc(o.what)}</span>
      <div class="oven-track"><div class="oven-fill" style="width:max(${w}%, 92px)">${range}<span style="position:relative">${o.temp}℃ · ${time}</span></div></div>
    </div>`;
  }).join("");
  const ticks = [0, scaleMax / 2, scaleMax].map((t) => `<span>${fmt(t)}분</span>`).join("");
  const notes = r.ovens.filter((o) => o.note).map((o) => `${esc(o.what)}: ${esc(o.note)}`).join(" · ");
  const summary = `${[...new Set(r.ovens.map((o) => o.temp + "℃"))].join(" · ")} · ${r.ovens.length}번 굽기`;
  return `<section class="oven${foldClass("oven")}">
    ${foldHead("oven", "box-head", `<span class="sec-title">🔥 오븐</span><span class="fold-summary box-extra">${summary}</span>`)}
    <div class="fold-body">
    ${rows}
    <div class="oven-scale"><span></span><div class="ticks">${ticks}</div></div>
    ${notes ? `<p style="margin:8px 0 0;font-size:12px;color:var(--ink-3)">${notes}</p>` : ""}
    </div>
  </section>`;
}

function renderQty(item) {
  if (item.qty == null) return `<span class="ing-qty">${rich(item.text)}</span>`;
  const scaled = item.qty * state.scale;
  const orig = state.scale !== 1 ? `<span class="orig">원래 ${fmt(item.qty)}${esc(item.unit)}</span>` : "";
  return `<span class="ing-qty">${fmt(scaled)}<span class="u">${esc(item.unit)}</span>${orig}</span>`;
}

function renderPart(r, part, pi) {
  const total = partTotal(part);
  const maxG = Math.max(...part.items.map(gramsOf), 1);
  const items = part.items.map((item, ii) => {
    const key = `${r.id}:${pi}:${ii}`;
    const done = state.checked.has(key);
    const g = gramsOf(item);
    const bar = g ? `<div class="ing-bar" aria-hidden="true"><span style="width:${(g / maxG) * 100}%"></span></div>` : "";
    const note = item.note ? `<div class="ing-note">${rich(item.note)}</div>` : "";
    return `<li class="${done ? "done" : ""}">
      <label class="ing-row">
        <input type="checkbox" data-key="${key}" ${done ? "checked" : ""} aria-label="${esc(item.name)} 계량 완료">
        <span class="ing-name">${esc(item.name)}</span>
        ${renderQty(item)}
      </label>
      ${bar}${note}
    </li>`;
  }).join("");

  const steps = part.steps.map((s, si) => {
    const badges = [
      ...(s.heat ? [`<span class="chip heat">🔥 ${esc(s.heat)}</span>`] : []),
      ...(s.badges || []).map((b) => `<span class="chip">${rich(b)}</span>`),
    ].join("");
    const sub = s.sub ? `<ul class="sub">${s.sub.map((x) => `<li>${rich(x)}</li>`).join("")}</ul>` : "";
    return `<li>
      <span class="dot">${si + 1}</span>
      ${s.title ? `<span class="st-title">${esc(s.title)}</span>` : ""}${rich(s.text)}
      ${badges ? `<div class="badges">${badges}</div>` : ""}
      ${sub}
    </li>`;
  }).join("");

  const notes = part.notes ? `<ul class="notes">${part.notes.map((n) => `<li>${rich(n)}</li>`).join("")}</ul>` : "";
  const totalLabel = total ? `합계 <b>${fmt(total * state.scale)}g</b>` : "";

  const key = `part-${pi}`;
  const head = `<span class="ttl">${r.parts.length > 1 ? `<span class="num" style="--pc:${partColor(pi)}">${pi + 1}</span>` : ""}${esc(part.name)}</span>
      <span class="total">${totalLabel}</span>`;
  return `<section class="part${foldClass(key)}">
    ${foldHead(key, "part-head", head)}
    <div class="part-body fold-body">
      <div class="col"><h4 class="sec-title">재료</h4><ul class="ing">${items}</ul></div>
      <div class="col"><h4 class="sec-title">만드는 법</h4><ol class="steps">${steps}</ol>${notes}</div>
    </div>
  </section>`;
}

function render() {
  const r = recipes.find((x) => x.id === state.id) || recipes[0];
  renderPicker();
  const seg = scales.map((s) => `<button data-scale="${s}" aria-pressed="${s === state.scale}">×${s}</button>`).join("");
  const checkedHere = [...state.checked].filter((k) => k.startsWith(r.id + ":")).length;
  const notes = r.notes.length
    ? `<section class="tip${foldClass("notes")}">
        ${foldHead("notes", "box-head", `<span class="sec-title">📝 메모 · 보관</span><span class="fold-summary box-extra">${r.notes.length}개</span>`)}
        <div class="fold-body"><ul class="notes">${r.notes.map((n) => `<li>${rich(n)}</li>`).join("")}</ul></div>
      </section>`
    : "";
  const allFolded = foldKeys(r).every(isFolded);

  document.getElementById("view").innerHTML = `
    <section class="hero">
      <h2>${r.emoji} ${esc(r.name)}</h2>
      <div class="source">${rich(r.source)}</div>
      <div class="chips">${r.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      <div class="toolbar">
        <span class="label">배율</span>
        <div class="seg" role="group" aria-label="배율">${seg}</div>
        <span class="spacer"></span>
        <button class="link-btn" data-fold-all="${allFolded ? "open" : "close"}">${allFolded ? "모두 펼치기" : "모두 접기"}</button>
        ${checkedHere ? `<button class="link-btn" data-reset="${r.id}">계량 체크 ${checkedHere}개 지우기</button>` : `<span class="label" style="color:var(--ink-3)">재료를 눌러 계량 체크</span>`}
      </div>
    </section>
    ${renderCombined(r)}
    ${renderOven(r)}
    ${r.parts.map((p, i) => renderPart(r, p, i)).join("")}
    ${notes}`;
}

document.addEventListener("click", (e) => {
  const pick = e.target.closest(".pick");
  if (pick) {
    state.id = pick.dataset.id;
    state.scale = 1;
    try { history.replaceState(null, "", "#" + state.id); } catch (_) {}
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const fold = e.target.closest("[data-fold]");
  if (fold) {
    const key = `${state.id}:${fold.dataset.fold}`;
    if (state.folded.has(key)) state.folded.delete(key); else state.folded.add(key);
    saveFolds();
    render();
    return;
  }
  const foldAll = e.target.closest("[data-fold-all]");
  if (foldAll) {
    const r = recipes.find((x) => x.id === state.id);
    for (const k of foldKeys(r)) {
      if (foldAll.dataset.foldAll === "close") state.folded.add(`${state.id}:${k}`);
      else state.folded.delete(`${state.id}:${k}`);
    }
    saveFolds();
    render();
    return;
  }
  const sc = e.target.closest("[data-scale]");
  if (sc) { state.scale = Number(sc.dataset.scale); render(); return; }
  const reset = e.target.closest("[data-reset]");
  if (reset) {
    for (const k of [...state.checked]) if (k.startsWith(reset.dataset.reset + ":")) state.checked.delete(k);
    render();
  }
});

document.addEventListener("change", (e) => {
  const key = e.target.dataset && e.target.dataset.key;
  if (!key) return;
  if (e.target.checked) state.checked.add(key); else state.checked.delete(key);
  render();
});

const fromHash = location.hash.slice(1);
if (recipes.some((r) => r.id === fromHash)) state.id = fromHash;
render();
</script>
